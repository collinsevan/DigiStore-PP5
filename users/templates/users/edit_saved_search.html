{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="content-backdrop"></div>

<div class="container header-container">
    <div class="row">
        <div class="col">
            <div class="product-form-wrapper">
                <h2 class="logo-font">Saved Searches</h2>
                <h5 class="text-muted">Edit saved search</h5>
                <hr>

                <p class="text-muted">
                    Update your saved search
                    <strong>{{ saved_search.title }}</strong>.
                </p>

                <form method="POST" action="{% url 'edit_saved_search' saved_search.id %}" class="form mb-2">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="text-right">
                        <a class="btn btn-outline-black rounded-0" href="{% url 'profile' %}">
                            Cancel
                        </a>
                        <button class="btn btn-black rounded-0" type="submit">
                            Update Saved Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
