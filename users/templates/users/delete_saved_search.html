{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="content-backdrop"></div>

<div class="container header-container">
    <div class="row">
        <div class="col">
            <div class="product-form-wrapper">
                <h2 class="logo-font">Saved Searches</h2>
                <h5 class="text-muted">Delete saved search</h5>
                <hr>

                <p>
                    Are you sure you want to delete saved search
                    <strong>{{ saved_search.title }}</strong>?
                </p>

                <p class="text-muted mb-2">
                    Query:
                    <strong>{{ saved_search.query }}</strong>
                </p>

                <p class="text-muted mb-4">
                    This action cannot be undone.
                </p>

                <form method="POST" action="{% url 'delete_saved_search' saved_search.id %}">
                    {% csrf_token %}

                    <a class="btn btn-outline-black rounded-0" href="{% url 'profile' %}">
                        Cancel
                    </a>

                    <button class="btn btn-danger rounded-0" type="submit"
                        onclick="return confirm('Are you sure you want to delete this saved search? This cannot be undone.');">
                        Delete Saved Search
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
